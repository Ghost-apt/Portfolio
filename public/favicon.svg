<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#0B1120" stroke="url(#grad)" stroke-width="3" />
  <text x="50" y="62" font-family="'Space Grotesk', system-ui, sans-serif" font-size="40" font-weight="800" fill="url(#grad)" text-anchor="middle" filter="url(#glow)">AS</text>
  <circle cx="80" cy="24" r="5" fill="#22D3EE" />
</svg>
